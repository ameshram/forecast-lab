name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install libgomp (LightGBM OpenMP runtime)
        run: sudo apt-get update && sudo apt-get install -y libgomp1

      - name: Install dependencies (light subset)
        # Deliberately NOT `pip install -r requirements.txt`: torch,
        # chronos-forecasting, timesfm, and neuralforecast are heavy and pull
        # model weights over the network. The tests that need them are guarded
        # with `pytest.importorskip`, so they skip cleanly when absent. This
        # keeps CI fast (~1 min) and deterministic while still exercising the
        # frozen harness (metrics/backtest/gates/ledger), the baselines, the
        # composites, the global LightGBM, and the anti-leakage feature checks.
        # Verified locally: 34 passed, 8 skipped with exactly these deps.
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "pandas>=2.0" "numpy>=1.26" "pyarrow>=15.0" "PyYAML>=6.0" \
            "pytest>=8.0" "scikit-learn>=1.4" "lightgbm>=4.7"

      - name: Run tests
        run: python -m pytest tests/ -v
