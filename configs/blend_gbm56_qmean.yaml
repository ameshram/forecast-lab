model:
  name: blend
  params:
    models:
      - name: global_lgbm
        params:
          n_anchors: 56
          lgb_params:
            n_estimators: 300
            learning_rate: 0.08
            num_leaves: 127
            min_child_samples: 50
            tweedie_variance_power: 1.2
      - name: chronos
        params:
          checkpoint: amazon/chronos-bolt-base
          batch_size: 256
          point: qmean
          device: cpu
    weights: [0.5, 0.5]
backtest: {n_origins: 4, horizon: 13, step: 13}
notes: "Cycle 9 (Stage 3 - the blend): 50/50 average of GBM-56 (d047d88915, lumpy bias -10.5%) and Chronos-Bolt qmean (828187da8a, lumpy bias +15.2%) via the leak-free blend composite. Weights PINNED 50/50 (untuned - a sweep is shopping). Mechanism: equal-and-opposite lumpy biases should cancel the R4-blocking lumpy bias no single model could fix, while keeping both models' January strength (0.497/0.730 vs champion 0.892). Parent champion 7548b6e864 (GBM-24, 0.5622). Zero new model code. Run with OMP_NUM_THREADS=1 KMP_DUPLICATE_LIB_OK=TRUE (libomp/torch OpenMP mitigation)."
